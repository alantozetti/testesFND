<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamento</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="formContainer">
        <h3>Orçamento</h3> <br>
        <form id="productForm">
            <input type="text" id="produto" name="produto" placeholder="Digite o produto" required>
            <input type="number" id="quantidade" name="quantidade" step="any" placeholder="Digite a quantidade" required>
            <select id="unidadeMed" name="unidadeMed" required>
                <option value="m²">m²</option>
                <option value="ml">ml</option>
                <option value="rl">rl</option> <option value="cx">cx</option>
            </select>
            <input type="text" id="precoUni" name="precoUni" placeholder="Preço Unitário" required>
            <button type="submit">Adicionar Produto</button>
        </form>
    </div>
    <br>
    <div id="clienteContainer">
        <div id="addClient"></div>
    </div>
    <br>
    <div id="total"> Total dos Itens: R$ 0,00</div>

    <script src="script.js"></script>  
</body>
</html>
